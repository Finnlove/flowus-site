const md = "最近很热的历史不计入中考，这并不是说历史不重要。而是在中考这个非常重要的节点上为学生减负，因为历史这个东西你什么时候学都可以，甚至年龄大了再学更合适。初中生他的阅历是不够的，他是没有办法去感受历史背后的深层的原因的，顶多就是作为常识了解一下，因为10多岁的孩子你不可能要求他在背负9门功课的情况下去成为国学大师吧，这太不科学了。再者很多的人他可能一辈子没读过什么书，他只知道种地，只知道打工，但这不妨碍他依然是个好人，依然是个爱国的人吧。难道说很多大字不识的爷爷奶奶不知道秦始皇姓什么就不认他是始皇帝了？一个老人可能一辈子没有机会接受完整教育，甚至不会写自己的名字，但他仍然可以是一个善良的人、勤劳的人、对家庭负责的人，也完全可以拥有朴素而真实的家国情感。所以初中生的知识学习本来就是以脱盲为主的均衡通识教育，并不要求个个搞成文化老儒。\n\n十几岁的孩子学“秦始皇统一六国”，可以知道：\n\n> 发生了什么。\n\n但等一个人三十岁、四十岁，有了工作、家庭、社会经验，再回头读秦汉史，他理解的问题可能已经完全不同：\n\n> 为什么需要统一？\n> 为什么统一以后又会出现巨大的治理成本？\n> 为什么制度会形成这样的演变？\n> 为什么普通人的生活会受到这些制度变化的影响？\n\n**同一本历史书，不同年龄读，完全是不同的东西。**\n\n所以历史并不存在一个“初中不学就永远失去”的窗口。\n\n语言则不太一样，一个孩子今天没学秦朝，十年以后拿一本历史书照样可以重新建立知识体系，并且可能会更容易，因为有了阅历的加持。但如果一个人完全没有语言基础，也不是不能长大以后再学。只是难度会大的多，要是到了需要阅读英文资料、参加国际交流的时候，再临时开始学，成本就更高了，让一个背负房贷、奶粉钱的成年人去背单词学语法我个人觉得不亚于遭受顶级酷刑。大家可以对比一下：\n\n一个十岁孩子：\n\n> 每天有大量时间 → 大脑处于语言学习阶段 → 没有房贷、工作、家庭责任 → 可以长期重复输入。\n\n一个三十多岁的成年人：\n\n> 工作八小时 → 通勤 → 家庭事务 → 育儿 → 房贷车贷 → →被领导骂→睡眠不足 → 晚上还要抽时间背单词、学语法。\n\n至于英语的学习，我还是那句话，英语作为主科对于原本落后的中国快速培养一批国际交流能力的人才是起到过积极的贡献的。说到历史，我们回顾离我们自己最近的历史，三十年来，我国对于外国先进文化和双语人才的缺乏和渴求是有目共睹的。我的观点是，英语是一门工具语言，具备其他学科不具备的语言学特点，学习需要长时间大跨度的支持，这是所有语言学科的必然要求，换成任何一门语言类学科都是如此。**我国高考并非只能选英语，我国高考也从来不是语文＋数学＋英语的捆绑**，而是白纸黑字写的外语，不喜欢英语的完全可以用日语、俄语、法语等代替英语学科进行报考，没有任何问题：\n\n![高考外语科目](assets/gaokao-foreign-lang.png)\n\n再一个教育部也规定了，外语的课时本来就是三大主科里最少的，至于他为什么考的那么难，是因为高考就是筛选而不是义务教育，很多人觉得我幸苦读了这么久的书就必须要上大学，很遗憾不是的，**国家没有义务保证每个人一定有大学上**，更不可能保证每个人都有工作，所以**只要筛选还在，争论这个事情就意义不大。**如果要取消就应该全部都取消，考研英语更难怎么没人闹腾要取消考研英语呢？\n\n改革开放以后，中国和世界重新建立起大规模、持续性的人员、技术、贸易、教育和文化交流。那个阶段中国面对的一个非常现实的问题就是：大量先进知识、技术、论文、教材、管理经验和文化产品首先以外语存在，而能够直接使用这些信息、进行跨语言交流的人才并不充裕。所以当时大力发展外语教育，尤其是英语教育，是有非常明确的时代背景和工具价值的。这和“英语比其他学科高贵”完全是两回事。恰恰相反，它说明了一个非常朴素的教育原则：社会，特别是工业社会在某个阶段缺什么能力，基础教育就应该尽可能帮助下一代补上这种能力。\n\n对于任何一门学科来说，以及对于一个正常的人，本来就应该是：有些东西很擅长，有些东西一般，有些东西只是知道，有些东西成年以后才慢慢深入，甚至是非常功利的出于现实需要才去拼命学习，这才是正常的人类知识结构。所以我们没有必要去争论，**如果自己觉得自己不喜欢，或者用不上的完全可以不学啊。**但是一旦发现自己需要这个学科，我相信真正要学的人是拦也拦不住的。对于青少年，特别是初中生来说，先把有限的时间和精力集中在通识性的、工具性的科目上，把基础的逻辑、理解、语言工具打牢固，这才是开始去理解其他学科深层次智慧的前提。\n\n初中生每天就那么多时间和注意力，如果把所有学科都按照“高强度、深挖、竞赛化”的方式推进，结果很可能不是知识更丰富，而是每门课都变成了记忆负担。并且应该先客观后主观，因为孩子首先需要学会的，不是“我怎么看”，而是：客观的事物是什么样的。不要急着去判断，更不要急着去扣帽子。比如学历史，第一步应该是：发生了什么；什么时候发生；谁参与了；前后有什么关系；有哪些可靠的史料；而不是应该去钻研细枝末节的老学究问题，那样既不科学也不利于**备战中考**。因此，这个阶段的历史**不是不学，而是应该以通识为主**，浅尝辄止的了解大概的史实基础知识就可以了。等到我们进入大学再来有时间根据自己的爱好慢慢的去深入的了解。\n\n而英语作为语言学习，早一点学当然是好过晚一点学的，成年人学英语比小孩是要普遍困难的，这一点无需再争论，再者大可以选择小语种，也一样可以高考。还有就是每个年龄应该优先去做适合这个年龄段的事情，不要一说到历史就扯宏大叙述，把成年人的那套东西代入进来要求孩子去过度前瞻不仅没有益处，还会占用孩子有限的知识带宽，导致孩子的其他科目无法均衡的学下来，这岂不是更糟糕。如果成年人觉得某个领域很重要，就把成年人的知识体系、价值判断和宏大叙事整套提前压给孩子，表面上看是在“拓宽视野”，实际上很可能是在透支认知资源。\n\n真正科学的教育应该是：\n\n> **在合适的年龄，完成这个年龄最值得完成的认知任务。**\n\n四年级最重要的事情可能是：**把阅读能力、计算能力、语言能力、自主学习能力慢慢建立起来。**初中最重要的是：**建立比较完整的通识知识框架，同时形成基本的逻辑、证据意识和独立学习能力。**高中以后，才有更充分的知识基础去进行学科分化和深入思考。大学乃至成年以后，再去做真正意义上的专业研究、哲学思考、历史解释。这不是“孩子学得少了”，而是**把学习放到了正确的时间轴上。**\n\n假设一个孩子因为家长特别重视历史，从初一开始大量阅读宏大历史、政治哲学、文明史，结果每天挤占大量时间：数学基础没有夯实；外语长期输入不足；语文阅读质量下降；科学学科只能疲于应付；睡眠和运动也被压缩。最后家长还觉得：“你看，我家孩子视野多广。”那真没啥可说的了，这种人自己觉得好就好吧，尊重祝福。\n\n初中教育的一个重要目标，本来就是让孩子获得一张比较完整的知识地图。过早把成年人的复杂世界塞给孩子，并不会自动产生深度，很多时候只是产生了成年人的词汇 + 孩子的知识储备。看起来很深，实际上是空的。而一个孩子能够把自己的数学、语文、英语、科学、历史、地理等基础知识均衡地建立起来，逐渐形成阅读、逻辑、建模、证据和自主学习能力，到了更大的年龄，他反而会有足够的知识带宽去自己选择：“我真正对哪一部分感兴趣？”然后自己往下钻。教育真正应该保护的，恰恰是这种“以后还能继续深入”的可能性。而不是在孩子十几岁的时候，就急着把成年人的全部答案塞给他，让他小小年纪就学宏大历史研究世界走向，预测经济命脉，那不是扯淡是什么。人倒是不怕扯淡，就怕没能脚踏实地的学好眼前该学的东西。";
document.getElementById('content').innerHTML = marked.parse(md);
</script>
