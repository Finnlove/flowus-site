<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    :root { --ink:#33291f; --accent:#b4552d; --soft:#8a7a63; }
    @media (prefers-color-scheme: dark) { :root { --ink:#e2d9c6; --accent:#e0855a; --soft:#8f8676; } }
    .ring { fill:none; stroke:var(--ink); stroke-width:2.4; opacity:.85; }
    .arc  { fill:none; stroke:var(--accent); stroke-width:2.4; stroke-linecap:round;
            stroke-dasharray:26 118; transform-origin:32px 32px; animation:spin 3.6s linear infinite; }
    .core { fill:var(--accent); animation:breathe 2.4s ease-in-out infinite; transform-origin:32px 32px; }
    .wave { fill:none; stroke:var(--soft); stroke-width:1.6; stroke-linecap:round; animation:pulse 2.4s ease-out infinite; transform-origin:32px 32px; }
    .tick { stroke:var(--ink); stroke-width:1.6; stroke-linecap:round; opacity:.5; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { transform: scale(.86); } 50% { transform: scale(1.06); } }
    @keyframes pulse { 0% { transform: scale(.9); opacity:.55; } 70% { transform: scale(1.5); opacity:0; } 100% { opacity:0; } }
  </style>
  <circle class="ring" cx="32" cy="32" r="23"/>
  <circle class="arc" cx="32" cy="32" r="23"/>
  <circle class="wave" cx="32" cy="32" r="13"/>
  <circle class="core" cx="32" cy="32" r="7.5"/>
  <g class="tick">
    <line x1="32" y1="4" x2="32" y2="9"/>
    <line x1="32" y1="55" x2="32" y2="60"/>
    <line x1="4" y1="32" x2="9" y2="32"/>
    <line x1="55" y1="32" x2="60" y2="32"/>
  </g>
</svg>
