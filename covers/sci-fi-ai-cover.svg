<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="40%" stop-color="#0c1430"/>
      <stop offset="100%" stop-color="#081020"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff00aa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff00aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      .grid { stroke: #00e5ff; stroke-width: 0.6; opacity: 0.25; }
      .particle { fill: #00ffff; animation: float 7s infinite ease-in-out; }
      .scan { stroke: #00ff9d; stroke-width: 2.5; opacity: 0.65; animation: scanline 5.5s linear infinite; }
      .hex { fill: none; stroke: #ff2ea6; stroke-width: 1.8; opacity: 0.75; animation: pulse 2.8s infinite ease-in-out; }
      .wave { fill: none; stroke: #00d4ff; stroke-width: 1.4; opacity: 0.55; stroke-dasharray: 12 8; animation: dash 3.5s linear infinite; }
      @keyframes float {
        0%, 100% { transform: translateY(0px); opacity: 0.25; }
        50% { transform: translateY(-25px); opacity: 0.95; }
      }
      @keyframes scanline {
        0% { transform: translateX(-300px); }
        100% { transform: translateX(1900px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -180; }
      }
    </style>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <g class="grid">
    <line x1="0" y1="80" x2="1600" y2="80"/>
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="240" x2="1600" y2="240"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/>
    <line x1="1120" y1="0" x2="1120" y2="400"/>
    <line x1="1280" y1="0" x2="1280" y2="400"/>
    <line x1="1440" y1="0" x2="1440" y2="400"/>
  </g>
  <line class="scan" x1="0" y1="40" x2="0" y2="360" stroke-dasharray="8 6"/>
  <circle class="particle" cx="120" cy="70" r="2.2" style="animation-delay:0s"/>
  <circle class="particle" cx="280" cy="140" r="1.6" style="animation-delay:0.7s"/>
  <circle class="particle" cx="460" cy="55" r="2.4" style="animation-delay:1.4s"/>
  <circle class="particle" cx="620" cy="210" r="1.8" style="animation-delay:0.3s"/>
  <circle class="particle" cx="820" cy="95" r="2.1" style="animation-delay:2.1s"/>
  <circle class="particle" cx="1020" cy="175" r="1.5" style="animation-delay:1.1s"/>
  <circle class="particle" cx="1220" cy="65" r="2.3" style="animation-delay:1.8s"/>
  <circle class="particle" cx="1420" cy="230" r="1.7" style="animation-delay:0.5s"/>
  <polygon class="hex" points="380,140 415,158 415,202 380,220 345,202 345,158"/>
  <polygon class="hex" points="780,90 825,112 825,168 780,190 735,168 735,112" style="animation-delay:1.2s"/>
  <polygon class="hex" points="1180,170 1215,188 1215,232 1180,250 1145,232 1145,188" style="animation-delay:0.6s"/>
  <path class="wave" d="M150 210 Q350 90 550 210 T950 180 T1350 220" />
  <circle cx="800" cy="200" r="90" fill="url(#glowCyan)" opacity="0.35" filter="url(#softBlur)"/>
  <circle cx="380" cy="150" r="45" fill="url(#glowMagenta)" opacity="0.25" filter="url(#softBlur)"/>
  <circle cx="1180" cy="200" r="55" fill="#00ff9d" opacity="0.12" filter="url(#softBlur)"/>
  <text x="70" y="365" fill="#00f0ff" font-family="monospace" font-size="16" opacity="0.55" letter-spacing="3">AI COMPETITION · 2026</text>
</svg>