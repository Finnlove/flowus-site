<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0ff"/>
      <stop offset="40%" stop-color="#e6f2ff"/>
      <stop offset="75%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#fff0f5"/>
    </linearGradient>
    <radialGradient id="blob1" cx="30%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="72%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>
    <style>
      .blob { animation: floatBlob 10s ease-in-out infinite; }
      .blob2 { animation: floatBlob 12s ease-in-out infinite reverse; }
      .blob3 { animation: floatBlob 9s ease-in-out infinite; animation-delay: -3s; }
      .particle { fill: #ffffff; animation: twinkle 3.2s ease-in-out infinite; }
      .line { fill: none; stroke: #a78bfa; stroke-width: 1.6; opacity: 0.5; stroke-dasharray: 6 12; animation: drift 12s linear infinite; }
      .line2 { fill: none; stroke: #93c5fd; stroke-width: 1.4; opacity: 0.4; stroke-dasharray: 5 10; animation: drift 16s linear infinite reverse; }
      @keyframes floatBlob {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(40px, -30px) scale(1.08); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.4); }
      }
      @keyframes drift { to { stroke-dashoffset: -300; } }
    </style>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" filter="url(#softGrain)"/>
  <ellipse class="blob" cx="460" cy="150" rx="300" ry="170" fill="url(#blob1)"/>
  <ellipse class="blob2" cx="1140" cy="210" rx="340" ry="190" fill="url(#blob2)"/>
  <ellipse class="blob3" cx="800" cy="290" rx="260" ry="110" fill="url(#blob3)"/>
  <path class="line" d="M80 160 Q380 60 680 190 T1280 130"/>
  <path class="line2" d="M180 280 Q520 340 820 250 T1420 300"/>
  <g>
    <circle class="particle" cx="160" cy="80" r="3.2" style="animation-delay: 0s"/>
    <circle class="particle" cx="300" cy="130" r="2.4" style="animation-delay: 0.6s"/>
    <circle class="particle" cx="540" cy="60" r="2.8" style="animation-delay: 1.2s"/>
    <circle class="particle" cx="720" cy="110" r="2.2" style="animation-delay: 0.3s"/>
    <circle class="particle" cx="960" cy="75" r="3" style="animation-delay: 1.5s"/>
    <circle class="particle" cx="1200" cy="100" r="2.5" style="animation-delay: 0.8s"/>
    <circle class="particle" cx="1360" cy="65" r="2.7" style="animation-delay: 1.8s"/>
    <circle class="particle" cx="230" cy="270" r="2.3" style="animation-delay: 1s"/>
    <circle class="particle" cx="660" cy="310" r="2.6" style="animation-delay: 0.4s"/>
    <circle class="particle" cx="1060" cy="260" r="2.4" style="animation-delay: 1.3s"/>
  </g>
  <text x="80" y="355" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="3.5" opacity="0.7">2026 · AI COMPETITION</text>
</svg>