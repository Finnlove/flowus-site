<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1222"/>
    </linearGradient>
    <radialGradient id="softGlow" cx="62%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmAccent" cx="28%" cy="62%" r="28%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>
    <style>
      .ring { fill: none; stroke: #94a3b8; stroke-width: 0.8; opacity: 0.35; }
      .ring-soft { fill: none; stroke: #cbd5e1; stroke-width: 0.6; opacity: 0.18; }
      .dot { fill: #e2e8f0; opacity: 0.55; }
      .orbit { fill: none; stroke: #64748b; stroke-width: 0.9; opacity: 0.22; stroke-dasharray: 3 9; animation: drift 48s linear infinite; }
      .glow-orb { animation: breathe 9s ease-in-out infinite; }
      @keyframes drift { to { stroke-dashoffset: -280; } }
      @keyframes breathe {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.85; }
      }
      @keyframes floaty {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .float { animation: floaty 14s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" filter="url(#grain)" opacity="0.9"/>
  <circle cx="980" cy="190" r="220" fill="url(#softGlow)" class="glow-orb"/>
  <circle cx="420" cy="240" r="140" fill="url(#warmAccent)"/>
  <g transform="translate(980,190)">
    <circle class="ring" r="70"/>
    <circle class="ring-soft" r="110"/>
    <circle class="ring" r="155" opacity="0.22"/>
    <circle class="orbit" r="128"/>
    <circle class="orbit" r="178" style="animation-duration: 72s; opacity: 0.14;"/>
  </g>
  <g transform="translate(320,200)" class="float">
    <circle class="ring" r="48" stroke="#e2e8f0" opacity="0.28"/>
    <circle class="dot" cx="0" cy="-48" r="2.2"/>
    <path d="M -28 18 L 28 18" stroke="#94a3b8" stroke-width="0.7" opacity="0.4"/>
  </g>
  <g fill="#e2e8f0">
    <circle cx="140" cy="68" r="1.1" opacity="0.45"/>
    <circle cx="260" cy="112" r="0.8" opacity="0.35"/>
    <circle cx="510" cy="48" r="1.3" opacity="0.5"/>
    <circle cx="720" cy="86" r="0.9" opacity="0.3"/>
    <circle cx="1180" cy="72" r="1.2" opacity="0.4"/>
    <circle cx="1360" cy="140" r="0.7" opacity="0.28"/>
    <circle cx="1480" cy="96" r="1" opacity="0.38"/>
    <circle cx="190" cy="290" r="0.9" opacity="0.32"/>
    <circle cx="640" cy="310" r="1.1" opacity="0.36"/>
    <circle cx="1320" cy="270" r="0.8" opacity="0.3"/>
  </g>
  <line x1="0" y1="312" x2="1600" y2="312" stroke="#334155" stroke-width="0.8" opacity="0.5"/>
  <text x="72" y="348" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" letter-spacing="4.5" opacity="0.55">2026 · AI COMPETITION</text>
</svg>