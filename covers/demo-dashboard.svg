<rect width="1600" height="400" fill="url(#bg)"/>
<g stroke="#ffffff" stroke-opacity=".06"><path d="M0 120 L1600 120"/><path d="M0 220 L1600 220"/><path d="M0 320 L1600 320"/></g>
